<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Horse Lord</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
        background: #131c11;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }
      #app {
        position: fixed;
        inset: 0;
        display: block;
      }
      /* The overlay itself never eats a touch; each child opts in or out with
         its own pointer-events. No blanket child rule here — `#overlay > *`
         carries ID specificity, which silently defeats every `.panel
         { pointer-events: auto }` opt-in and killed the end-of-run buttons. */
      #overlay {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="app"></canvas>
    <div id="overlay"></div>
    <script type="module" src="/src/render/game3d.ts"></script>
  </body>
</html>
